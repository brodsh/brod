# cargo-deny policy for both Rust crates. CI runs:
#   cargo deny --manifest-path server/Cargo.toml --config deny.toml check
#   cargo deny --manifest-path deploy/runtime/supervisor/Cargo.toml --config deny.toml check

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Each ignored advisory needs a reason here and in docs/security.md.
ignore = []

[licenses]
version = 2
# Licenses that can be combined with Brod's AGPL-3.0-only. Anything else fails CI.
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "0BSD",
  "MPL-2.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
  "BSL-1.0",
  "CC0-1.0",
  "Unlicense",
  # The Mozilla CA bundle in webpki-roots.
  "CDLA-Permissive-2.0",
  # Copyleft licenses that AGPL-3.0 can include. GPL-2.0-only is deliberately absent: it cannot be combined with AGPL-3.0.
  "GPL-2.0-or-later",
  "GPL-3.0-only",
  "GPL-3.0-or-later",
  "LGPL-2.1-only",
  "LGPL-2.1-or-later",
  "LGPL-3.0-only",
  "LGPL-3.0-or-later",
  "AGPL-3.0-only",
  "AGPL-3.0-or-later",
]
confidence-threshold = 0.93
unused-allowed-license = "allow"

[bans]
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
