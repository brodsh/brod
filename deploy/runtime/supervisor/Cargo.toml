[package]
name = "brod-runtime"
version = "0.1.0"
edition = "2024"
description = "Runs workerd for Brod's server apps and restarts it when an app stalls it, crashes it or makes it too big"
publish = false

[[bin]]
name = "brod-runtime"
path = "src/main.rs"

[dependencies]
libc = "0.2"

[profile.release]
strip = true
