# Brod serves HTTPS itself, with no proxy: certificates from Let's Encrypt on demand (BROD_TLS=acme). Layer it on the
# main file, from the repository root:
#   docker compose -f docker-compose.yml -f deploy/compose.tls.yml up -d
# Needs in .env: BROD_PUBLIC_URL=https://<host>, APPS_DOMAIN, ACME_EMAIL, and DNS records pointing at this server.
# Brod listens on unprivileged ports inside the container; the host's 443 and 80 are mapped to them. Certificates and
# the ACME account are kept in the brod-data volume (/data/certs).
services:
  brod:
    environment:
      BROD_TLS: acme
      BROD_TRUST_PROXY: "0"
      BROD_HTTPS_LISTEN: 0.0.0.0:8443
      BROD_HTTP_LISTEN: 0.0.0.0:8000
    ports: !override
      - "443:8443"
      - "80:8000"
