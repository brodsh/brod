# Deploys a released version to brod.sh once the Release workflow has pushed its
# images, then sends a push notification through ntfy with the result.
# Release candidates (tags with a "-") are never deployed automatically.
# Run it by hand (Actions → Deploy → Run workflow) to redeploy or roll back.
#
# The SSH key is pinned on the server to deploy/upgrade-ssh.sh (installed as
# /opt/brod/upgrade-ssh.sh with /opt/brod/upgrade.sh): it can only upgrade to a version.
#
# Repository secrets:
#   DEPLOY_HOST         server hostname
#   DEPLOY_SSH_KEY      private deploy key (forced command on the server)
#   DEPLOY_KNOWN_HOSTS  output of `ssh-keyscan <host>`
#   NTFY_TOPIC          ntfy.sh topic (keep it unguessable; the repo is public)
name: Deploy

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to deploy, e.g. 0.2.0"
        required: true
      force:
        description: "Allow a downgrade / skip the compose-file hold"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       startsWith(github.event.workflow_run.head_branch, 'v') &&
       !contains(github.event.workflow_run.head_branch, '-'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - name: Version
        id: v
        env:
          INPUT: ${{ github.event.inputs.version || github.event.workflow_run.head_branch }}
        run: |
          v="${INPUT#v}"
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "bad version: $INPUT"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Upgrade
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          VERSION: ${{ steps.v.outputs.version }}
          FORCE: ${{ github.event.inputs.force == 'true' && 'force ' || '' }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts
          set -o pipefail
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes -o ServerAliveInterval=30 \
            "root@$HOST" "$FORCE$VERSION" 2>&1 | tee upgrade.log

      - name: Notify
        if: always()
        env:
          TOPIC: ${{ secrets.NTFY_TOPIC }}
          STATUS: ${{ job.status }}
          VERSION: ${{ steps.v.outputs.version }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$TOPIC" ] || exit 0
          log=$(cat upgrade.log 2>/dev/null || true)
          if [ "$STATUS" = success ]; then
            title="brod.sh is on v$VERSION"; tags=white_check_mark; prio=default
          elif grep -q "HOLD" <<<"$log"; then
            title="brod.sh v$VERSION held, needs you"; tags=pause_button; prio=high
          elif grep -q "ROLLED BACK" <<<"$log"; then
            title="brod.sh v$VERSION failed, rolled back"; tags=warning; prio=high
          else
            title="brod.sh deploy v$VERSION failed"; tags=rotating_light; prio=urgent
          fi
          body=$(grep -E "DEPLOYED|HOLD|FAILED|ROLLED BACK|ROLLBACK|backup:" <<<"$log" | tail -n 6)
          [ -n "$body" ] || body=$(tail -n 6 <<<"$log")
          [ -n "$body" ] || body="job $STATUS"
          curl -fsS -H "Title: $title" -H "Tags: $tags" -H "Priority: $prio" -H "Click: $RUN" \
            -d "$body" "https://ntfy.sh/$TOPIC" >/dev/null
