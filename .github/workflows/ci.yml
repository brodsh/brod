# Every push and pull request: no secrets in the history, dependency licenses and advisories, the Rust server's
# format, lints, unit tests and end-to-end suites (on SQLite and on Postgres), the Node unit tests, and the Docker
# images and Compose stack (built and started, never pushed). Actions are pinned by commit; Dependabot updates them.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Node unit tests (the preview service's address guard, deploy/preview/guard.mjs), and the generated config docs.
  node:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - name: docs/configuration.md matches .env.example
        run: node scripts/config-docs.mjs --check

  # No secret anywhere in the history (.gitleaks.toml allows only the tests' placeholder values).
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz
          echo "a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks detect --source . --redact --no-banner
          ./gitleaks detect --source . --no-git --redact --no-banner

  # Dependency policy (deny.toml): licenses compatible with AGPL-3.0, no known advisories, crates.io only; then
  # cargo audit against the same RustSec database.
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-deny@0.20.2,cargo-audit@0.22.2
      - name: cargo deny (server)
        run: cargo deny --manifest-path server/Cargo.toml --config deny.toml check
      - name: cargo deny (runtime supervisor)
        run: cargo deny --manifest-path deploy/runtime/supervisor/Cargo.toml --config deny.toml check
      - name: cargo audit
        run: |
          cargo audit --file server/Cargo.lock --deny warnings
          cargo audit --file deploy/runtime/supervisor/Cargo.lock --deny warnings
      - name: npm audit
        run: npm audit --audit-level=low

  # The Rust server (server/): format, lints, unit tests, the end-to-end suite with server apps on
  # the workerd runtime and without it, and the Docker images (built only, never pushed).
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install Rust
        run: rustup toolchain install 1.97 --profile minimal --component rustfmt,clippy && rustup default 1.97
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            server/target
            deploy/runtime/supervisor/target
          key: rust-${{ runner.os }}-${{ hashFiles('server/Cargo.lock', 'deploy/runtime/supervisor/Cargo.lock') }}
      - name: Format
        run: |
          cargo fmt --manifest-path server/Cargo.toml --check
          cargo fmt --manifest-path deploy/runtime/supervisor/Cargo.toml --check
      - name: Lints
        run: |
          cargo clippy --manifest-path server/Cargo.toml --all-targets --locked -- -D warnings
          cargo clippy --manifest-path deploy/runtime/supervisor/Cargo.toml --all-targets --locked -- -D warnings
      - name: Unit tests
        run: |
          cargo test --manifest-path server/Cargo.toml --locked
          cargo test --manifest-path deploy/runtime/supervisor/Cargo.toml --locked
      - name: Chromium for marketplace previews (deploy/preview/)
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests, server apps on workerd
        run: npm run e2e:rust
      - name: End-to-end tests, self-hosted defaults (first start, no secrets or email set)
        run: npm run e2e:self-hosted
        env:
          BROD_BIN: server/target/release/brod
      - name: End-to-end tests, static apps only (server apps refused)
        run: npm run e2e:rust:static
        env:
          BROD_BIN: server/target/release/brod
      - name: End-to-end tests, app files in S3
        run: npm run e2e:rust:s3
        env:
          BROD_BIN: server/target/release/brod
      - name: End-to-end tests, Brod's own HTTPS against Pebble (Let's Encrypt's test CA)
        run: npm run e2e:tls
        env:
          BROD_BIN: server/target/release/brod
      - name: Build the Docker images (not pushed)
        run: |
          docker compose build
          docker build -f deploy/preview/Dockerfile -t brod-preview:ci .
      - name: Check the Compose files
        run: |
          cp .env.example .env
          printf 'BROD_API_HOST=brod.example.com\nAPPS_DOMAIN=apps.example.com\nACME_EMAIL=ci@example.com\nBROD_PREVIEW_SECRET=ci-preview-secret-0123456789\n' >> .env
          docker compose config --quiet
          docker compose -f docker-compose.yml -f deploy/compose.caddy.yml config --quiet
          docker compose -f docker-compose.yml -f deploy/compose.tls.yml config --quiet
          docker compose -f docker-compose.yml -f deploy/compose.preview.yml config --quiet
          rm .env
      - name: Quickstart (cp .env.example .env, docker compose up -d, the sign-in link in the log)
        run: |
          cp .env.example .env
          docker compose up -d --wait
          docker compose logs --no-log-prefix brod | tee brod.log
          grep -q '/auth/verify?token=' brod.log
          curl -fsS http://localhost:8080/healthz
          docker compose down -v
          rm .env brod.log
      - name: HTTPS through Caddy (deploy/smoke-test.sh)
        run: |
          deploy/smoke-test.sh
          docker compose -p brodsmoke down -v

  # The Rust server with its database in Postgres (BROD_DATABASE_URL): the unit tests, the SQLite-to-Postgres copy,
  # and the same end-to-end suite.
  rust-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: pg
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      BROD_TEST_DATABASE_URL: postgres://postgres:pg@127.0.0.1:55432/postgres
      E2E_DATABASE_URL: postgres://postgres:pg@127.0.0.1:55432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install Rust
        run: rustup toolchain install 1.97 --profile minimal && rustup default 1.97
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            server/target
            deploy/runtime/supervisor/target
          key: rust-pg-${{ runner.os }}-${{ hashFiles('server/Cargo.lock', 'deploy/runtime/supervisor/Cargo.lock') }}
      - name: Unit tests on Postgres
        run: cargo test --manifest-path server/Cargo.toml --locked
      - name: Chromium for marketplace previews (deploy/preview/)
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests on Postgres, server apps on workerd
        run: npm run e2e:rust:pg
      - name: End-to-end tests on Postgres, app files in S3, static apps only
        run: node scripts/e2e-rust.mjs pg s3 static
        env:
          BROD_BIN: server/target/release/brod
