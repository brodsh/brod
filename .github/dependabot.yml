# Weekly updates for every kind of dependency. Minor and patch updates of one kind arrive as a single PR.
version: 2
updates:
  - package-ecosystem: cargo
    directories: ["/server", "/deploy/runtime/supervisor"]
    schedule: { interval: weekly }
    commit-message: { prefix: "chore(deps)" }
    groups:
      rust: { update-types: [minor, patch] }

  - package-ecosystem: npm
    directory: "/"
    schedule: { interval: weekly }
    commit-message: { prefix: "chore(deps)" }
    groups:
      npm: { update-types: [minor, patch] }

  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: weekly }
    commit-message: { prefix: "chore(deps)" }
    groups:
      actions: { update-types: [minor, patch] }

  - package-ecosystem: docker
    directories: ["/", "/deploy/runtime", "/deploy/preview"]
    schedule: { interval: weekly }
    commit-message: { prefix: "chore(deps)" }

  - package-ecosystem: docker-compose
    directories: ["/", "/deploy"]
    schedule: { interval: weekly }
    commit-message: { prefix: "chore(deps)" }
