name: Bug
description: Something in Brod does not work as documented.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to reproduce it
      placeholder: |
        1. docker compose up -d
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The first line of `docker compose logs brod`, for example "Brod 0.1.0 (self-hosted)".
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: The relevant lines of `docker compose logs brod` (and `runtime`, for server apps). Remove sign-in links and tokens.
      render: text
