# git-cliff: release notes from conventional commits (feat:, fix:, ...). Used by .github/workflows/release.yml:
#   git cliff --latest --strip header
[changelog]
header = ""
body = """
{% if version %}## {{ version | trim_start_matches(pat="v") }} ({{ timestamp | date(format="%Y-%m-%d") }}){% else %}## Unreleased{% endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | split(pat="\n") | first | upper_first }}{% if commit.breaking %} (breaking){% endif %}\
{% endfor %}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
protect_breaking_commits = true
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->New" },
  { message = "^fix", group = "<!-- 1 -->Fixed" },
  { message = "^perf", group = "<!-- 2 -->Faster" },
  { message = "^refactor", group = "<!-- 3 -->Changed" },
  { message = "^docs", group = "<!-- 4 -->Documentation" },
  { message = "^build|^ci", group = "<!-- 5 -->Build and CI" },
  { message = "^test", group = "<!-- 6 -->Tests" },
  { message = "^chore\\(deps", skip = true },
  { message = "^chore", group = "<!-- 7 -->Housekeeping" },
]
tag_pattern = "v[0-9].*"
sort_commits = "oldest"
