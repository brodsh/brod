<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>{{TITLE}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..700&family=Instrument+Sans:wght@400..700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* A quiet rail on the left, one readable column on the right, and a single marigold button that always means "deploy". */
:root{--brand:{{ACCENT}};
  --bg:#F1F5F2;--surface:#FBFCFB;--sunk:#E7EDE8;--ink:#15201B;--muted:#5A6860;--line:#D7E0D9;
  --deploy:#F4B62E;--deploy-ink:#221800;--deploy-edge:#C98F12;--green:#1E5B4A;
  --ok:#2B7A4B;--warn:#9A6208;--bad:#B2372E;--bad-bg:#FBECEA;--warn-bg:#FBF2DC;
  --display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --body:'Instrument Sans','Segoe UI',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;
  --r:10px;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#111815;--surface:#182019;--sunk:#0C120F;--ink:#E6EDE8;--muted:#93A199;--line:#2A3630;
  --deploy-edge:#A87608;--green:#7FD0B0;--ok:#6CC48D;--warn:#E3AD4E;--bad:#F0857A;--bad-bg:#2E1A18;--warn-bg:#2C2412;color-scheme:dark}}
:root[data-theme=dark]{
  --bg:#111815;--surface:#182019;--sunk:#0C120F;--ink:#E6EDE8;--muted:#93A199;--line:#2A3630;
  --deploy-edge:#A87608;--green:#7FD0B0;--ok:#6CC48D;--warn:#E3AD4E;--bad:#F0857A;--bad-bg:#2E1A18;--warn-bg:#2C2412;color-scheme:dark}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(1.6rem,4vw,2.1rem);font-weight:650;line-height:1.15;display:flex;flex-wrap:wrap;align-items:center;gap:12px}
h2{font-size:1.1rem;font-weight:600}
h3{font-size:1.02rem;font-weight:600}
p{margin:0}
ul,ol{list-style:none;margin:0;padding:0}
.mono{font-family:var(--mono);font-size:.86em;overflow-wrap:anywhere}
.muted{color:var(--muted)}.small{font-size:.85rem}.num{font-variant-numeric:tabular-nums}
.nowrap{white-space:nowrap}.grow{flex:1 1 200px;min-width:0}.right{text-align:right}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
.sub{color:var(--muted);max-width:62ch}
:focus-visible{outline:2px solid var(--green);outline-offset:2px;border-radius:4px}

.shell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.side{display:flex;flex-direction:column;gap:22px;padding:24px 16px;position:sticky;top:0;align-self:start;height:100vh;overflow-y:auto}
.brand{all:unset;cursor:pointer;display:flex;align-items:center;gap:9px;font:650 1.15rem var(--display);padding:0 8px;min-width:0}
.brand span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.logo{flex:none;width:22px;height:14px;border-radius:8px;background:var(--deploy);box-shadow:7px -5px 0 -2px var(--deploy)}
.wsicon{flex:none;font-size:1.2rem;line-height:1}
.nav{display:flex;flex-direction:column;gap:14px}
.navgroup{display:flex;flex-direction:column;gap:2px}
.navlabel{padding:0 10px 4px;font-size:.72rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.nav button{all:unset;cursor:pointer;padding:7px 10px;border-radius:8px;color:var(--muted);display:flex;justify-content:space-between;align-items:center;gap:8px}
.nav button:hover{color:var(--ink);background:var(--sunk)}
.nav button.on{color:var(--ink);background:var(--sunk);font-weight:600}
.sidefoot{margin-top:auto;display:flex;flex-direction:column;gap:8px;align-items:flex-start;font-size:.8rem;color:var(--muted);padding:0 8px;min-width:0;max-width:100%}
.sidefoot .who{overflow-wrap:anywhere}
.sidefoot form{margin:0}
.main{border-left:1px solid var(--line);padding:36px clamp(16px,4vw,48px) 80px;max-width:1040px;width:100%;display:flex;flex-direction:column;gap:32px;min-width:0}
.main section{display:flex;flex-direction:column;gap:12px}
.head{display:flex;flex-wrap:wrap;gap:16px 24px;justify-content:space-between;align-items:flex-start}
.head>div{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1 1 320px}
.sechead{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.crumbs{font-size:.85rem;color:var(--muted)}

.btn{border:1px solid var(--line);background:var(--surface);padding:7px 14px;border-radius:9px;cursor:pointer;font-weight:550;white-space:nowrap;text-decoration:none;display:inline-block;color:var(--ink)}
.btn:hover{border-color:var(--muted)}
.btn.quiet{background:transparent;border-color:transparent;color:var(--muted)}
.btn.quiet:hover{color:var(--ink);background:var(--sunk)}
.btn.deploy{background:var(--deploy);color:var(--deploy-ink);border-color:var(--deploy-edge);font-weight:700;box-shadow:0 2px 0 var(--deploy-edge)}
.btn.deploy:hover{transform:translateY(-1px);box-shadow:0 3px 0 var(--deploy-edge)}
.btn.deploy:active{transform:translateY(1px);box-shadow:0 1px 0 var(--deploy-edge)}
.btn.deploy.big{font-size:1.15rem;padding:12px 34px;border-radius:12px}
.btn[disabled]{opacity:.5;cursor:default;transform:none}
.btn.dangerbtn{color:var(--bad)}
.link{all:unset;cursor:pointer;color:var(--green);text-decoration:underline;text-decoration-color:color-mix(in srgb,var(--green) 35%,transparent);text-underline-offset:3px}
.link:hover{text-decoration-color:currentColor}
.link:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.link.name{color:var(--ink);font-weight:650;font-family:var(--display);font-size:1.02rem;text-decoration:none}
.link.name:hover{text-decoration:underline}
.link.danger{color:var(--bad);text-decoration-color:color-mix(in srgb,var(--bad) 35%,transparent)}
.acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

.pill{display:inline-flex;align-items:center;gap:6px;font:600 .78rem var(--body);letter-spacing:0;padding:2px 10px 2px 8px;border-radius:99px;border:1px solid var(--line);white-space:nowrap;background:var(--surface)}
.pill i{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.pill.ok{color:var(--ok)}.pill.ok i{background:var(--ok)}
.pill.warn{color:var(--warn)}.pill.warn i{background:var(--warn)}
.pill.bad{color:var(--bad);border-color:var(--bad)}.pill.bad i{background:var(--bad)}
.pill.idle{color:var(--muted)}
.tag{font-size:.74rem;font-weight:600;padding:1px 8px;border-radius:6px;background:var(--sunk);color:var(--muted);white-space:nowrap}

.stats{display:grid!important;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0!important;border-block:1px solid var(--line)}
.stat{all:unset;cursor:pointer;display:flex;flex-direction:column;padding:16px 16px 16px 0}
.stat b{font:650 1.7rem var(--display)}
.stat span{color:var(--muted);font-size:.88rem}
.stat:hover span{color:var(--ink);text-decoration:underline}
.stat:focus-visible{outline:2px solid var(--green);outline-offset:-2px}

.list{border-top:1px solid var(--line)}
.list>li{display:flex;flex-wrap:wrap;align-items:center;gap:10px 20px;padding:14px 0;border-bottom:1px solid var(--line)}
.list.tight>li{padding:9px 0}
.alert{background:var(--bad-bg);border:1px solid color-mix(in srgb,var(--bad) 35%,transparent)!important;border-radius:var(--r);padding:14px 16px!important;margin-top:8px}
.alert.access{background:var(--warn-bg);border-color:color-mix(in srgb,var(--warn) 40%,transparent)!important}
.list:has(.alert){border-top:0}
.audit .mark{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
.audit.denied .mark{background:transparent;border:2px solid var(--bad)}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.cardtop{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.cardfoot{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:auto;padding-top:8px;border-top:1px solid var(--line)}
.cardfoot .link{margin-left:auto}
.url{color:var(--muted)}
.search input{width:min(100%,320px)}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:32px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}

.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>span{font-size:.8rem;font-weight:600;color:var(--muted)}
input:not([type=checkbox]):not([type=radio]):not([type=file]),select,textarea{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;min-width:0;width:100%}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--green);outline-offset:0;border-radius:8px}
select.mini{width:auto;padding:3px 6px;font-size:.85rem}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:14px}
.inline{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
.stack{display:flex;flex-direction:column;gap:12px}
.check{display:flex;align-items:center;gap:6px;padding-bottom:8px}
.deployform{gap:20px;padding:24px}
.deployline{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:10px}
.choice{display:flex;align-items:flex-start;gap:10px;border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;cursor:pointer;background:var(--surface)}
.choice input{accent-color:var(--green);margin-top:.3em}
.choice.on{border-color:var(--green);box-shadow:0 0 0 1px var(--green)}
.choice span{display:flex;flex-direction:column}.choice small{color:var(--muted)}
.sharebar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;background:var(--sunk);border-radius:var(--r);padding:8px 8px 8px 14px}
.sharebar .mono{flex:1 1 200px;min-width:0}
.note.stage{border-left-color:var(--warn)}
.note{border-left:3px solid var(--green);background:var(--surface);padding:12px 14px;border-radius:0 var(--r) var(--r) 0;display:flex;flex-direction:column;gap:10px}
.warnnote{border-left-color:var(--bad);background:var(--bad-bg)}
.drop{display:flex;flex-direction:column;align-items:flex-start;gap:4px;border:1px dashed var(--line);border-radius:var(--r);padding:18px;cursor:pointer;background:var(--bg)}
.drop:hover,.drop.over{border-color:var(--green);background:color-mix(in srgb,var(--green) 6%,var(--bg))}
.drop.has{border-style:solid}
.drop b{font-weight:600;color:var(--ink)}
.drop input{display:none}

.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line)}
.tabs button{all:unset;cursor:pointer;padding:8px 12px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button.on{color:var(--ink);border-color:var(--ink);font-weight:600}
.tabs button:focus-visible,.nav button:focus-visible,.brand:focus-visible{outline:2px solid var(--green);outline-offset:-2px}
.tabbody{display:flex;flex-direction:column;gap:28px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:16px 24px;margin:0}
.kv dt{font-size:.8rem;color:var(--muted);font-weight:600}.kv dd{margin:0;overflow-wrap:anywhere}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th{text-align:left;font-size:.78rem;color:var(--muted);font-weight:600;padding:6px 12px 6px 0;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 12px 10px 0;border-bottom:1px solid var(--line);vertical-align:middle}
th.right,td.right{padding-right:0}
.logs{margin:0;background:var(--sunk);border-radius:var(--r);padding:14px;font:.8rem/1.7 var(--mono);min-width:520px;white-space:pre-wrap}
.lg.error{color:var(--bad)}
.split{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:24px;align-items:start}

.steps{display:flex;flex-direction:column;gap:10px;font-size:1.05rem}
.step{display:flex;align-items:center;gap:12px;color:var(--muted)}
.tick{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);flex:none}
.step.done{color:var(--ink)}.step.done .tick{background:var(--ok);border-color:var(--ok)}
.step.now{color:var(--ink);font-weight:600}.step.now .tick{border-color:var(--deploy-edge);background:var(--deploy);animation:pulse .9s ease-in-out infinite}
.step.fail{color:var(--bad)}.step.fail .tick{border-color:var(--bad)}
@keyframes pulse{50%{transform:scale(.7)}}
@media(prefers-reduced-motion:reduce){.step.now .tick{animation:none}.btn.deploy:hover,.btn.deploy:active{transform:none}}
.livebox{border:1px solid var(--ok);border-radius:var(--r);background:var(--surface);padding:20px;display:flex;flex-direction:column;gap:12px}
.failbox{border-color:var(--bad)}
.bigurl{font-size:clamp(1rem,3.4vw,1.4rem);font-weight:600}
.err{color:var(--bad);font-size:.9rem;flex-basis:100%}

.gate{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:14px;overflow:hidden}
.gatebar{height:6px;background:var(--brand);margin:-20px -20px 4px}
.fakeinput{border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--muted)}
.fakebtn{background:var(--brand);color:#fff;border-radius:9px;padding:8px 14px;text-align:center;font-weight:600}
.usage{display:flex;align-items:center;gap:10px}
.spark{max-width:100%;height:auto;overflow:visible;display:block}
.spark-line{fill:none;stroke:var(--green);stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round;vector-effect:non-scaling-stroke}
.spark-fill{fill:color-mix(in srgb,var(--green) 13%,transparent)}
.spark-dot{fill:var(--green)}
.chart{border:1px solid var(--line);border-radius:var(--r);padding:12px;background:var(--surface)}
.chart .spark{width:100%;height:96px}
.meters{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:16px 24px}
.meterbox{display:flex;flex-direction:column;gap:6px}
.meterbox .row{display:flex;justify-content:space-between;gap:8px;font-size:.88rem}
.meter{height:6px;border-radius:99px;background:var(--sunk);overflow:hidden}
.meter>i{display:block;height:100%;background:var(--green);border-radius:inherit}
.meter.full>i{background:var(--bad)}
.eyebrow{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.bill .total{font:650 2.6rem/1.1 var(--display);text-transform:capitalize}
.plan.current{border-color:var(--green);box-shadow:0 0 0 1px var(--green)}
.price{font:650 1.6rem/1.2 var(--display)}.price small{font:500 .85rem var(--body);color:var(--muted)}
.plan ul{display:flex;flex-direction:column;gap:4px;font-size:.9rem}
.plan ul li::before{content:"✓";color:var(--ok);font-weight:700;margin-right:8px}
.plan .btn{align-self:flex-start;margin-top:auto}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;font-weight:600;font-size:.9rem;max-width:calc(100% - 32px);z-index:5}
.loading{color:var(--muted)}
textarea{resize:vertical;min-height:4.5em}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.preview{display:flex;flex-direction:column;gap:6px;margin:-4px -4px 2px}
.shot{border-radius:8px;overflow:hidden;background:var(--sunk);aspect-ratio:16/10;border:1px solid var(--line)}
.shot img,.shot video{width:100%;height:100%;object-fit:cover;display:block}
.shot video{object-fit:contain;background:#000}
.thumbs{display:flex;flex-wrap:wrap;gap:6px}
.thumbs button{all:unset;cursor:pointer;width:52px;height:32px;border-radius:5px;overflow:hidden;border:1px solid var(--line);background:var(--sunk);position:relative}
.thumbs button.on{border-color:var(--green);box-shadow:0 0 0 1px var(--green)}
.thumbs button:focus-visible{outline:2px solid var(--green);outline-offset:1px}
.thumbs img,.thumbs video{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.thumbs .play{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:.8rem;text-shadow:0 1px 2px #000}
.medialist{display:flex;flex-wrap:wrap;gap:12px}
.medialist li{display:flex;flex-direction:column;gap:4px;width:150px}
.medialist .shot{aspect-ratio:16/10}
[hidden]{display:none!important}

/* ---------- analytics ---------- */
/* Two validated categorical slots (views, visitors) and one sequential hue for bars and the heatmap. */
:root{--s1:#2a78d6;--s2:#eb6834;--good:#2B7A4B;--ni:#9A6208;--poor:#B2372E}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--s1:#3987e5;--s2:#d95926;--good:#6CC48D;--ni:#E3AD4E;--poor:#F0857A}}
:root[data-theme=dark]{--s1:#3987e5;--s2:#d95926;--good:#6CC48D;--ni:#E3AD4E;--poor:#F0857A}
.anbar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.anbar select{width:auto;max-width:100%}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--surface);max-width:100%;overflow-x:auto}
.seg button{all:unset;cursor:pointer;padding:6px 11px;font-size:.88rem;color:var(--muted);white-space:nowrap}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--sunk);color:var(--ink);font-weight:600}
.seg button[aria-disabled=true]{opacity:.45;cursor:not-allowed}
.seg button:focus-visible{outline:2px solid var(--green);outline-offset:-2px}
.livedot{display:inline-flex;align-items:center;gap:7px;font-size:.88rem;color:var(--muted)}
.livedot i{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 25%,transparent)}
.kpis{display:grid!important;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:0;border-block:1px solid var(--line)}
.kpi{display:flex;flex-direction:column;gap:2px;padding:14px 14px 14px 0;min-width:0}
.kpi b{font:650 1.55rem/1.2 var(--display);font-variant-numeric:tabular-nums}
.kpi span{color:var(--muted);font-size:.84rem}
.delta{font-size:.78rem;font-weight:600;font-variant-numeric:tabular-nums}
.delta.up{color:var(--good)}.delta.down{color:var(--poor)}.delta.flat{color:var(--muted)}
.plot{position:relative;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:12px 12px 6px}
.plot svg{display:block;width:100%;height:auto;overflow:visible}
.plot .grid{stroke:var(--line);stroke-width:1}
.plot .axis{fill:var(--muted);font:11px var(--body)}
.plot .l1{fill:none;stroke:var(--s1);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.plot .a1{fill:color-mix(in srgb,var(--s1) 12%,transparent)}
.plot .l2{fill:none;stroke:var(--s2);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.plot .cross{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 3}
.plot .dot1{fill:var(--s1);stroke:var(--surface);stroke-width:2}.plot .dot2{fill:var(--s2);stroke:var(--surface);stroke-width:2}
.plot .bar{fill:var(--s1)}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);border-radius:8px;padding:7px 10px;font-size:.8rem;line-height:1.45;white-space:nowrap;z-index:2;transform:translate(-50%,-100%);margin-top:-8px}
.tip b{font-weight:650}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.84rem;color:var(--muted);padding:4px 2px 0}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:3px;border-radius:2px;display:inline-block}
.panels{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:18px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.panel .tabs{margin:-4px 0 0}
.panel th.right,.panel td.right{padding-left:14px}
.bars{display:flex;flex-direction:column;gap:3px}
.brow{position:relative;display:flex;justify-content:space-between;gap:12px;padding:5px 8px;border-radius:6px;font-size:.88rem;min-width:0}
.brow>i{position:absolute;inset:0 auto 0 0;background:color-mix(in srgb,var(--s1) 16%,transparent);border-radius:6px}
.brow>span{position:relative;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brow>em{position:relative;font-style:normal;font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
.brow>em b{color:var(--ink);font-weight:600}
.bhead{display:flex;justify-content:space-between;font-size:.74rem;color:var(--muted);font-weight:600;padding:0 8px;text-transform:uppercase;letter-spacing:.05em}
.more{align-self:flex-start}
.heat{display:grid;grid-template-columns:34px repeat(24,minmax(0,1fr));gap:2px;font-size:.7rem;color:var(--muted)}
.heat i{aspect-ratio:1;border-radius:3px;background:var(--sunk);min-height:10px}
.heat span{display:flex;align-items:center}
.heat .hl{justify-content:center}
.vitals{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:12px}
.vital{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:6px}
.vital b{font:650 1.4rem var(--display);font-variant-numeric:tabular-nums}
.vital .st{font-size:.8rem;font-weight:600;display:inline-flex;gap:5px;align-items:center}
.st.good{color:var(--good)}.st.ni{color:var(--ni)}.st.poor{color:var(--poor)}
.dist{display:flex;height:6px;border-radius:99px;overflow:hidden;gap:2px;background:var(--surface)}
.dist i{display:block;height:100%}
.dist .g{background:var(--good)}.dist .n{background:var(--ni)}.dist .p{background:var(--poor)}
.sbar{display:flex;height:12px;border-radius:6px;overflow:hidden;gap:2px}
.sbar i{display:block;height:100%}
pre.snippet{margin:0;background:var(--sunk);border-radius:8px;padding:10px 12px;font:.8rem/1.6 var(--mono);overflow-x:auto;white-space:pre}
details.tableview summary{cursor:pointer;color:var(--muted);font-size:.85rem}

@media(max-width:780px){
  .shell{display:block}
  .side{position:static;height:auto;overflow:visible;flex-direction:row;flex-wrap:wrap;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}
  .sidedeploy{margin-left:auto}
  .nav{flex-direction:row;order:3;width:100%;overflow-x:auto;gap:2px}
  .navgroup{display:contents}
  .navlabel{display:none}
  .nav button{white-space:nowrap}
  .sidefoot{order:4;flex-direction:row;flex-wrap:wrap;margin:0;padding:0;align-items:center;gap:6px 14px}
  .sidefoot .who{display:none}
  .main{padding-top:24px;border-left:0}
}
</style>
<script type="application/json" id="boot">{{BOOT}}</script>

</div>
<div id="toast" role="status" hidden></div>
<script>
'use strict';
const B = JSON.parse(document.getElementById('boot').textContent);
const ADMIN = B.role === 'admin';
const $main = document.getElementById('main');

// ---------- small helpers ----------
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'value') el.value = v;
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid instanceof Node ? kid : String(kid));
  return el;
}
async function api(path, { method = 'GET', body } = {}) {
  const r = await fetch('/v1' + path, {
    method, credentials: 'same-origin',
    headers: { 'x-brod-workspace': B.workspace, ...(body ? { 'content-type': 'application/json' } : {}) },
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error?.message || `${r.status} ${r.statusText}`);
  return data;
}
const enc = encodeURIComponent;
/** BROD_NETWORK on this server: "enforce" refuses outside requests an app does not declare, "log" only records them. */
let NETWORK_POLICY = 'log';
const notePolicy = (r) => { if (r?.network_policy) NETWORK_POLICY = r.network_policy; return r; };
let toastTimer;
function toast(text) {
  const t = document.getElementById('toast');
  t.textContent = text; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => (t.hidden = true), 2600);
}
const err = (text) => h('p', { class: 'err', role: 'alert' }, text);
/** Run an action from a button or form: disable it while it runs, show any error next to it, then redraw. */
function act(fn, { redraw = true, done } = {}) {
  return async (e) => {
    e?.preventDefault?.();
    const btn = e?.submitter || e?.currentTarget;
    const spot = (btn?.closest?.('form, li, tr, section, .card')) || $main;
    const where = spot.tagName === 'TR' ? spot.lastElementChild : spot;
    where.querySelectorAll(':scope > .err').forEach(m => m.remove());
    if (btn?.tagName === 'BUTTON') btn.disabled = true;
    try {
      const r = await fn();
      if (r !== undefined && done) toast(typeof done === 'function' ? done(r) : done);
      if (redraw) await render();
      return r;
    } catch (x) { where.append(err(x.message)); }
    finally { if (btn?.tagName === 'BUTTON') btn.disabled = false; }
  };
}
async function copy(text) {
  try { await navigator.clipboard.writeText(text); toast('Copied'); } catch { prompt('Copy this:', text); }
}
const when = (iso) => iso ? new Date(iso).toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' }) : '';
function ago(iso) {
  if (!iso) return '';
  const s = (Date.now() - new Date(iso)) / 1000;
  if (s < 60) return 'just now';
  if (s < 3600) return `${Math.floor(s / 60)} min ago`;
  if (s < 86400) return `${Math.floor(s / 3600)} h ago`;
  if (s < 86400 * 7) return `${Math.floor(s / 86400)} d ago`;
  return new Date(iso).toLocaleDateString(undefined, { dateStyle: 'medium' });
}
const size = (n) => n > 1048576 ? (n / 1048576).toFixed(1) + ' MB' : n > 1024 ? Math.round(n / 1024) + ' KB' : n + ' B';
const host = (url) => url.replace(/^https?:\/\//, '');
const bytes = (n) => n >= 1073741824 ? +(n / 1073741824).toFixed(1) + ' GB' : n >= 10485760 ? Math.round(n / 1048576) + ' MB' : size(n);
const cap = (s) => s ? s[0].toUpperCase() + s.slice(1) : s;
function money(amount, currency) {
  try { return new Intl.NumberFormat(undefined, { style: 'currency', currency: currency.toUpperCase() }).format(amount / 100); }
  catch { return `${(amount / 100).toFixed(2)} ${String(currency).toUpperCase()}`; }
}
/** A small line chart of daily counts, oldest first. */
function spark(vals, w = 120, ht = 32) {
  const max = Math.max(1, ...vals), n = vals.length;
  const x = (i) => (n === 1 ? w : (i * w) / (n - 1)), y = (v) => ht - 2 - (v / max) * (ht - 4);
  const pts = vals.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  const box = document.createElement('div');
  box.innerHTML = `<svg class="spark" viewBox="0 0 ${w} ${ht}" width="${w}" height="${ht}" preserveAspectRatio="none" role="img" aria-label="${vals.reduce((a, b) => a + b, 0)} in ${n} days">
    <polygon class="spark-fill" points="0,${ht} ${pts} ${w},${ht}"/><polyline class="spark-line" points="${pts}"/>
    <circle class="spark-dot" cx="${x(n - 1).toFixed(1)}" cy="${y(vals[n - 1] || 0).toFixed(1)}" r="2.5"/></svg>`;
  return box.firstElementChild;
}
function meter(label, used, limit, fmt = String) {
  const pct = limit ? Math.min(100, Math.round((100 * used) / limit)) : 0;
  return h('div', { class: 'meterbox' }, h('div', { class: 'row' }, h('span', {}, label), h('span', { class: 'muted num' }, `${fmt(used)} of ${fmt(limit)}`)),
    h('div', { class: 'meter' + (pct >= 100 ? ' full' : ''), role: 'meter', 'aria-valuenow': used, 'aria-valuemax': limit, 'aria-label': label }, h('i', { style: `width:${pct}%` })));
}
const ACCESS = {
  private: ['Private', 'Only builders and admins of the workspace.'],
  people: ['Named people and groups', 'Only the people and groups listed below.'],
  workspace: [`Everyone in ${B.name}`, 'Every member of the workspace.'],
  password: ['Anyone with the password', 'No account needed: share the link and the password.'],
  signed_in: ['Anyone who signs in', 'Any email address, after a sign-in link.'],
  public: ['Public', 'Anyone with the link, no sign-in.'],
};
function select(name, options, value, attrs = {}) {
  return h('select', { name, id: attrs.id, 'aria-label': attrs.label || name, class: attrs.class },
    Object.entries(options).map(([v, label]) => h('option', { value: v, selected: v === value }, label)));
}
const field = (label, input, cls = '') => h('label', { class: 'field ' + cls }, h('span', {}, label), input);
function grantLabel(g) {
  return g.email || (g.group && 'group ' + g.group) || (g.domain && 'anyone @' + g.domain)
    || (g.everyone === 'workspace' ? 'everyone in the workspace' : g.everyone === 'signed_in' ? 'anyone signed in' : g.everyone);
}
function pill(a) {
  if (a.status === 'paused') return h('span', { class: 'pill idle' }, h('i'), 'Paused');
  if (!a.live_version) return h('span', { class: 'pill warn' }, h('i'), 'Not deployed');
  return h('span', { class: 'pill ok' }, h('i'), 'Live');
}
/** The version waiting on staging, as a small marker next to an app. */
const stageTag = (a) => a.staging ? h('span', { class: 'pill warn', title: `v${a.staging.version} is on staging, not live yet` }, h('i'), `v${a.staging.version} on staging`) : null;
/** The version waiting on staging: where to try it, and the buttons that make it live or take it off staging. */
function stagingNote(s, slug) {
  const st = s.staging;
  if (!st) return null;
  const v = (s.versions || []).find(x => x.version === st.version);
  return h('div', { class: 'note stage' },
    h('div', {}, h('b', {}, `v${st.version} is on staging, not live yet.`), ' ', v?.note ? `${v.note}. ` : '',
      s.live_version ? `Visitors still get v${s.live_version}. ` : 'Nothing is live yet. ',
      'Try it at the staging address below (only the app\'s builders can open it), then publish it when it is ready.'),
    h('div', { class: 'sharebar' }, h('span', { class: 'mono' }, st.url),
      h('a', { class: 'btn', href: st.url + '/', target: '_blank', rel: 'noopener' }, 'Open staging'),
      h('button', { class: 'btn', type: 'button', onclick: () => copy(st.url + '/') }, 'Copy link')),
    h('div', { class: 'acts' },
      h('button', { class: 'btn deploy', onclick: act(() => api(`/apps/${slug}/publish`, { method: 'POST', body: {} }), { done: r => `v${r.published} is live` }) }, `Publish v${st.version} to live`),
      h('button', { class: 'btn quiet', onclick: act(async () => {
        if (!confirm(`Take v${st.version} off staging without publishing it? The version is kept under Versions.`)) return;
        return api(`/apps/${slug}/staging`, { method: 'DELETE' });
      }, { done: 'Taken off staging' }) }, 'Discard')),
    h('p', { class: 'muted small' }, 'Staging and live share the app\'s data and secrets, so what you change while testing is real.'));
}
const head = (title, sub, action) => h('header', { class: 'head' }, h('div', {}, h('h1', {}, title), sub ? h('p', { class: 'sub' }, sub) : null), action || null);
const sechead = (title, extra) => h('div', { class: 'sechead' }, h('h2', {}, title), extra || null);
const empty = (title, text, action) => h('div', { class: 'empty' }, h('h3', {}, title), text ? h('p', { class: 'muted' }, text) : null, action || null);
const deployBtn = (label = 'Deploy an app') => h('button', { class: 'btn deploy', onclick: () => go('new') }, label);
const appLink = (slug, label) => h('button', { class: 'link', onclick: () => go('app', slug) }, label || slug);

// ---------- deploying a zip ----------
const MAX_BUNDLE = 25 * 1024 * 1024;
async function upload(target, file) {
  if (!file) throw new Error('Choose a .zip (or .tar.gz) of the built app first.');
  if (file.size > MAX_BUNDLE) throw new Error(`${file.name} is ${size(file.size)}. A bundle can be at most 25 MB.`);
  const addr = await api('/deploys', { method: 'POST', body: target });
  // The upload address is on this same server; keep the request same-origin whatever host the page was opened on.
  const r = await fetch(new URL(addr.upload_url).pathname, { method: 'PUT', body: file, credentials: 'same-origin' });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error?.message || `${r.status} ${r.statusText}`);
  return data;
}
function dropZone(onFile) {
  const input = h('input', { type: 'file', accept: '.zip,.tar,.tgz,.tar.gz,application/zip,application/gzip' });
  const label = h('b', {}, 'Drop a .zip of the built app here');
  const hint = h('span', { class: 'muted small' }, 'or click to choose one. Zip the folder with index.html, or _worker.js for server code. Up to 25 MB.');
  const zone = h('label', { class: 'drop' }, input, label, hint);
  const pick = (f) => { if (!f) return; zone.file = f; zone.classList.add('has'); label.textContent = f.name; hint.textContent = `${size(f.size)} · click to choose another`; onFile?.(f); };
  input.addEventListener('change', () => pick(input.files[0]));
  zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('over'); });
  zone.addEventListener('dragleave', () => zone.classList.remove('over'));
  zone.addEventListener('drop', e => { e.preventDefault(); zone.classList.remove('over'); pick(e.dataTransfer.files[0]); });
  return zone;
}
/** The deploy steps, shown while a bundle uploads and goes live. */
function progress(into, target, file, after) {
  const steps = ['Uploading the bundle', 'Unpacking and checking the files', target.environment === 'staging' ? 'On its staging address' : 'Live at its address'];
  const draw = (i, failed) => into.replaceChildren(h('ol', { class: 'steps' }, steps.map((s, n) =>
    h('li', { class: 'step ' + (failed && n === i ? 'fail' : n < i ? 'done' : n === i ? 'now' : '') }, h('span', { class: 'tick', 'aria-hidden': 'true' }), s))));
  if (!file) { into.replaceChildren(err('Choose a .zip (or .tar.gz) of the built app first.')); return Promise.resolve(); }
  draw(0);
  const t = setTimeout(() => draw(1), 700);
  return upload(target, file).then(d => {
    clearTimeout(t); draw(3);
    if (d.environment === 'staging') into.append(h('div', { class: 'livebox' },
      h('p', {}, `Deployed ${d.name} version ${d.version} to staging (${d.kind === 'server' ? 'server code' : 'static site'}, ${d.files} files). `,
        d.live_version ? `Visitors still get v${d.live_version} until you publish it.` : 'Nothing is live until you publish it.'),
      h('div', { class: 'bigurl mono' }, host(d.staging_url)),
      h('div', { class: 'acts' }, h('a', { class: 'btn', href: d.staging_url + '/', target: '_blank', rel: 'noopener' }, 'Try it on staging'),
        h('button', { class: 'btn', type: 'button', onclick: () => copy(d.staging_url + '/') }, 'Copy link'),
        h('button', { class: 'btn deploy', type: 'button', onclick: act(() => api(`/apps/${enc(d.app)}/publish`, { method: 'POST', body: {} }), { done: r => `v${r.published} is live` }) }, `Publish v${d.version} to live`))));
    else into.append(h('div', { class: 'livebox' },
      h('p', {}, `${d.created ? 'Created' : 'Deployed'} ${d.name}, version ${d.version} (${d.kind === 'server' ? 'server code' : 'static site'}, ${d.files} files).`),
      h('div', { class: 'bigurl mono' }, host(d.url)),
      h('div', { class: 'acts' }, h('a', { class: 'btn', href: d.url + '/', target: '_blank', rel: 'noopener' }, 'Open it'),
        h('button', { class: 'btn', type: 'button', onclick: () => copy(d.url + '/') }, 'Copy link'),
        h('button', { class: 'btn quiet', type: 'button', onclick: () => go('app', d.app, 'access') }, 'Share it'))));
    after?.(d);
  }, x => {
    clearTimeout(t); draw(1, true);
    into.append(h('div', { class: 'livebox failbox' }, h('b', {}, 'The deploy did not go through.'), h('p', {}, x.message)));
  });
}

// ---------- routing ----------
// #overview, #apps, #analytics[/<app>], #new, #app/<slug>/<tab>, #domains, #market, #spaces, #people, #groups, #log[/<app>[/refused]], #agents, #billing[/done]
// The sidebar in groups, so it stays readable as pages are added. A group with no label sits at the top.
const NAV = [
  [null, [['overview', 'Overview']]],
  ['Build', [['apps', 'Apps'], ['market', 'Marketplace'], ['domains', 'Domains']]],
  ['Insights', [['analytics', 'Analytics'], ['log', 'Activity']]],
  ['Team', [['people', 'People'], ['groups', 'Groups'], ['spaces', 'Spaces']]],
  ['Workspace', [['agents', 'Agents'], ...(ADMIN ? [['billing', 'Billing']] : [])]],
];
const PAGES = { overview, apps: directory, new: newApp, app: appPage, analytics, domains, market, spaces, people, groups, log: activity, agents, billing };
let R = route();
function route() {
  const [page, slug, tab] = location.hash.slice(1).split('/').map(decodeURIComponent);
  if (page === 'activity') return { page: 'log' };
  return page in PAGES ? { page, slug, tab } : { page: 'overview' };
}
function go(page, slug, tab) {
  const hash = '#' + [page, slug ?? (tab ? '' : null), tab].filter(x => x != null).map(enc).join('/');
  if (location.hash !== hash) history.pushState(null, '', hash);
  R = { page, slug: slug || undefined, tab };
  render(true);
  scrollTo(0, 0);
}
addEventListener('popstate', () => { R = route(); render(true); });
let seq = 0;
async function render(fresh) {
  const n = ++seq;
  const cur = R.page === 'app' || R.page === 'new' ? 'apps' : R.page;
  document.getElementById('nav').replaceChildren(...NAV.map(([group, items]) =>
    h('div', { class: 'navgroup', role: group ? 'group' : null, 'aria-label': group }, group ? h('span', { class: 'navlabel', 'aria-hidden': 'true' }, group) : null,
      items.map(([k, label]) => h('button', { class: cur === k ? 'on' : '', 'aria-current': cur === k ? 'page' : null, onclick: () => go(k) }, label)))));
  if (fresh) $main.replaceChildren(h('p', { class: 'loading' }, 'Loading…'));

    const view = await PAGES[R.page]();
    if (n !== seq) return;
    $main.replaceChildren(...[view].flat(2).filter(Boolean));
  } catch (x) { if (n === seq) $main.replaceChildren(head('Something went wrong'), err(x.message)); }
}

// ---------- overview ----------
const DENIED = new Set(['refused', 'password_failed', 'deploy_failed']);

    ...data.apps.filter(a => a.marketplace?.update_available).map(a => h('li', { class: 'alert access' },
      h('div', { class: 'grow' }, h('strong', {}, 'An update is waiting'), ' ', h('span', { class: 'muted' }, '· ', appLink(a.app, a.name)),
        h('p', {}, `${a.marketplace.name} release ${a.marketplace.latest_release} is out; this copy runs release ${a.marketplace.release}. Nothing changes until you deploy it.`)),
      h('div', { class: 'acts' }, h('button', { class: 'btn', onclick: () => go('app', a.app) }, 'Review update')))),
    ...data.apps.filter(a => a.staging).map(a => h('li', { class: 'alert access' },
      h('div', { class: 'grow' }, h('strong', {}, 'Waiting on staging'), ' ', h('span', { class: 'muted' }, '· ', appLink(a.app, a.name)),
        h('p', {}, `v${a.staging.version} is on its staging address for testing. ${a.live_version ? `Visitors still get v${a.live_version}` : 'Nothing is live'} until it is published.`)),
      h('div', { class: 'acts' }, h('a', { class: 'btn quiet', href: a.staging.url + '/', target: '_blank', rel: 'noopener' }, 'Try it'),
        h('button', { class: 'btn', onclick: () => go('app', a.app) }, 'Review')))),
    ...data.apps.filter(a => !a.live_version && !a.staging).map(a => h('li', { class: 'alert access' },
      h('div', { class: 'grow' }, h('strong', {}, 'Nothing deployed yet'), ' ', h('span', { class: 'muted' }, '· ', appLink(a.app, a.name)),
        h('p', {}, 'The app has an address but no live version, so visitors find nothing there.')),
      h('div', { class: 'acts' }, h('button', { class: 'btn', onclick: () => go('app', a.app, 'versions') }, 'Deploy it')))),
    ...refused.events.filter(e => Date.now() - new Date(e.at) < 3 * 86400e3 && new Date(e.at) > seenRefusals()).map(e => h('li', { class: 'alert' },
      h('div', { class: 'grow' }, h('strong', {}, 'Someone without access tried to get in'), ' ',
        h('span', { class: 'muted' }, e.app ? ['· ', appLink(e.app)] : null, ' · ', ago(e.at)), h('p', {}, e.detail, ' ', h('span', { class: 'muted' }, 'They were shown "App not found".'))),
      h('div', { class: 'acts' }, e.app ? h('button', { class: 'btn', onclick: () => go('app', e.app, 'access') }, 'Review access') : null,
        h('button', { class: 'btn quiet', type: 'button', title: 'Hide refusals up to this one. They stay in the activity log.', onclick: () => dismissRefusals(+new Date(e.at)) }, 'Dismiss')))),
  ];

  return [
    head(B.name, `${data.apps.length} ${data.apps.length === 1 ? 'app' : 'apps'}, ${live.length} running. Each one has its own address, sign-in and guest list.`, deployBtn()),
    needs.length ? h('section', {}, h('h2', {}, 'Needs you'), h('ul', { class: 'list' }, needs)) : null,
    h('section', { class: 'stats' },
      stat(`${data.running_apps} of ${data.app_limit}`, 'apps running', 'apps'),

}

// ---------- theme ----------
// The OS setting decides by default; a choice made here is remembered in this browser.
function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch { return null; } }
const dark = () => { const t = document.documentElement.dataset.theme; return t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; };
const themeBtn = document.getElementById('theme');
const paintTheme = () => (themeBtn.textContent = dark() ? 'Light theme' : 'Dark theme');
const saved = store('brod-theme');
if (saved === 'light' || saved === 'dark') document.documentElement.dataset.theme = saved;
themeBtn.addEventListener('click', () => { const t = dark() ? 'light' : 'dark'; document.documentElement.dataset.theme = t; store('brod-theme', t); paintTheme(); });
paintTheme();

// ---------- start ----------
const brand = document.getElementById('brand');
brand.append(B.icon ? h('span', { class: 'wsicon', 'aria-hidden': 'true' }, B.icon) : h('span', { class: 'logo', 'aria-hidden': 'true' }), h('span', {}, 'Brod', h('span', { class: 'muted' }, ' – '), B.name));
brand.addEventListener('click', () => go('overview'));
document.getElementById('sidedeploy').addEventListener('click', () => go('new'));
document.getElementById('who').textContent = B.email;
document.getElementById('role').textContent = B.role;
document.getElementById('home').href = `/w/${B.workspace}?view=apps`;
render(true);
</script>
</html>
