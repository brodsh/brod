# Postgres for developing Brod with `cargo run` (make dev). Reachable only from this machine, without a password.
# Never use this file on a server.
name: brod-dev

services:
  postgres:
    image: postgres:18-bookworm@sha256:5c4783a8cc3f0074912164f94dfa1be4e043438f0f707cf968d7af9a0d31a2c8
    environment:
      POSTGRES_USER: brod
      POSTGRES_DB: brod
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "brod", "-d", "brod"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  postgres-dev:
