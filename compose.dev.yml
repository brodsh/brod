# Postgres for developing Brod with `cargo run` (make dev). Reachable only from this machine, without a password.
# Never use this file on a server.
name: brod-dev

services:
  postgres:
    image: postgres:18-bookworm@sha256:afc7e2d441324c0388fa80c3d24f733b4194a4eb7f47dd8ee2b08eb1a24a647c
    environment:
      POSTGRES_USER: brod
      POSTGRES_DB: brod
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "brod", "-d", "brod"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  postgres-dev:
